<script>document.querySelectorAll('form[data-ok]').forEach(function(f){f.addEventListener('submit',function(e){e.preventDefault();f.classList.add('done');var o=f.querySelector('.ok');if(o)o.focus&&o.setAttribute('tabindex','-1')})});
document.querySelectorAll('.cf3').forEach(function(s){var wd=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],wl=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  function pick(sel,b){s.querySelectorAll(sel).forEach(function(x){x.setAttribute('aria-pressed',x===b)})}
  function sum(){var d=s.querySelector('.d[aria-pressed=true]'),t=s.querySelector('.t[aria-pressed=true]'),o=s.querySelector('input[name=cf3s]:checked');
    var dt=new Date(2026,10,+d.dataset.d);s.querySelector('.sel-day').textContent=wl[dt.getDay()]+' '+d.dataset.d+' November';
    s.querySelector('.s1').textContent=o.value+' · '+o.dataset.l.split(' · ')[0];s.querySelector('.s2').textContent=wd[dt.getDay()]+' '+d.dataset.d+' Nov at '+t.textContent}
  s.querySelectorAll('.d:not(:disabled)').forEach(function(b){b.addEventListener('click',function(){pick('.d',b);sum()})});
  s.querySelectorAll('.t').forEach(function(b){b.addEventListener('click',function(){pick('.t',b);sum()})});
  s.querySelectorAll('input[name=cf3s]').forEach(function(r){r.addEventListener('change',sum)});sum()});</script>
