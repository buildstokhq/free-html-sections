<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Footer 03 · Minimal one row</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* bs-scoped */
.bs-footer-03, .bs-footer-03 *, .bs-footer-03::before, .bs-footer-03 *::before, .bs-footer-03::after, .bs-footer-03 *::after {box-sizing:border-box}
.bs-footer-03 {--bs-brand:#4f46e5;--bs-brand-ink:#ffffff;--bs-ink:#0f172a;--bs-muted:#64748b;--bs-line:#e2e8f0;--bs-soft:#f8fafc;--bs-radius:12px;--bs-max:1200px;font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.bs-footer-03 {color:var(--bs-ink);background:#fff;-webkit-font-smoothing:antialiased}
.bs-footer-03 a {color:inherit;text-decoration:none}
.bs-footer-03 button {font:inherit;cursor:pointer}
.bs-footer-03 .bs-wrap {max-width:var(--bs-max);margin:0 auto;padding:0 24px}
.bs-footer-03 .bs-logo {display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.02em}
.bs-footer-03 .bs-logo-mark {display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--bs-brand);color:var(--bs-brand-ink)}
.bs-footer-03 .bs-btn {display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:10px;font-weight:600;font-size:14.5px;border:1px solid transparent;transition:.18s}
.bs-footer-03 .bs-btn-primary {background:var(--bs-brand);color:var(--bs-brand-ink)}
.bs-footer-03 .bs-btn-primary:hover {filter:brightness(1.1);transform:translateY(-1px)}
.bs-footer-03 .bs-btn-ghost {border-color:var(--bs-line);background:#fff}
.bs-footer-03 .bs-btn-ghost:hover {border-color:var(--bs-ink)}
.bs-footer-03 .bs-icon-btn {display:grid;place-items:center;width:42px;height:42px;border-radius:10px;border:0;background:transparent;color:inherit;position:relative}
.bs-footer-03 .bs-icon-btn:hover {background:rgba(127,127,127,.12)}
.bs-footer-03 .bs-sr {position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.bs-footer-03 :focus-visible {outline:2px solid var(--bs-brand);outline-offset:2px}
.bs-demo-body {min-height:340px;display:grid;place-items:center;color:var(--bs-muted);font-size:14px;background:repeating-linear-gradient(135deg,var(--bs-soft) 0 12px,#fff 12px 24px)}
.bs-footer-03 .m-toggle {display:none}.bs-footer-03 .m-toggle .i-close {display:none}
.bs-footer-03 .is-open .m-toggle .i-open {display:none}.bs-footer-03 .is-open .m-toggle .i-close {display:block}
.bs-footer-03 .m-panel {display:none}
@media(max-width:900px){.bs-footer-03 .m-toggle {display:grid}.bs-footer-03 .d-only {display:none!important}.bs-footer-03 .is-open .m-panel {display:block}}
.bs-footer-03 .m-panel {border-top:1px solid var(--bs-line);padding:12px 24px 24px;background:inherit}
.bs-footer-03 .m-links a {display:block;padding:14px 0;border-bottom:1px solid var(--bs-line);font-weight:600}
.bs-footer-03 .m-cta {display:grid;gap:10px;margin-top:18px}.bs-footer-03 .m-cta .bs-btn {width:100%}
.f3 {border-top:1px solid var(--bs-line);padding:28px 0;font-size:14.5px}
.f3 .row {display:flex;align-items:center;gap:32px;flex-wrap:wrap}
.f3 .bs-logo {font-size:17px}.f3 .bs-logo-mark {width:28px;height:28px}
.f3 nav {display:flex;gap:26px;flex-wrap:wrap;margin:0 auto;color:var(--bs-muted)}.f3 nav a:hover {color:var(--bs-ink)}
.f3 .c {color:var(--bs-muted)}
@media(max-width:700px){.f3 .row {flex-direction:column;gap:18px;text-align:center}.f3 nav {justify-content:center;gap:18px}}

/* bs-root-state */
@media(max-width:900px){.bs-footer-03.is-open .m-panel {display:block}}
.bs-footer-03.is-open .m-toggle .i-open {display:none}
.bs-footer-03.is-open .m-toggle .i-close {display:block}
</style>
<style>
/* Preview page only: you do not need this block in your site */
body {margin:0;color:var(--bs-ink);background:#fff;-webkit-font-smoothing:antialiased}
</style>
</head>
<body>
<main class="bs-footer-03 bs-demo-body">Your page content</main>

<footer class="bs-footer-03 f3"><div class="bs-wrap row"><a href="#" class="bs-logo" aria-label="Lumen home"><span class="bs-logo-mark"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 4v16h12"/></svg></span><span class="logo-name">Lumen</span></a><nav><a href="#">About</a><a href="#">Pricing</a><a href="#">Blog</a><a href="#">Contact</a><a href="#">Privacy</a></nav><span class="c">© 2026 Lumen</span></div></footer>
<script>document.querySelectorAll('[data-menu-toggle]').forEach(function(b){
  var h=b.closest('header');
  b.addEventListener('click',function(){var o=h.classList.toggle('is-open');b.setAttribute('aria-expanded',o);document.body.style.overflow=o&&h.hasAttribute('data-lock')?'hidden':''});
  h.querySelectorAll('.m-panel a').forEach(function(a){a.addEventListener('click',function(){h.classList.remove('is-open');b.setAttribute('aria-expanded','false');document.body.style.overflow=''})});
});
document.querySelectorAll('[data-sub]').forEach(function(b){b.addEventListener('click',function(){var o=b.parentElement.classList.toggle('sub-open');b.setAttribute('aria-expanded',o)})});</script>
</body>
</html>
