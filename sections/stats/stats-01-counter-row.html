<section class="bs-stats-01 st1">
  <div class="bs-wrap">
    <h2 class="t">Trusted by teams in <b>120 countries</b> to run their work, every day.</h2>
    <dl class="row"><div><dt><span data-count="40000" data-pre="" data-suf="+" data-dec="0">40,000+</span></dt><dd>teams using Lumen</dd></div><div><dt><span data-count="2.4" data-pre="" data-suf="B" data-dec="1">2.4B</span></dt><dd>tasks completed</dd></div><div><dt><span data-count="99.98" data-pre="" data-suf="%" data-dec="2">99.98%</span></dt><dd>uptime last 12 months</dd></div><div><dt><span data-count="4.9" data-pre="" data-suf="/5" data-dec="1">4.9/5</span></dt><dd>average review score</dd></div></dl>
  </div>
</section>
<script>(function(){var still=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function fmt(el,v){var d=+(el.dataset.dec||0),s=v.toFixed(d);if(el.dataset.sep!=='no')s=Number(s).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});el.textContent=(el.dataset.pre||'')+s+(el.dataset.suf||'')}
  function run(el){var to=+el.dataset.count;if(still){fmt(el,to);return}var t0=null;function step(t){if(!t0)t0=t;var p=Math.min(1,(t-t0)/1600),e=1-Math.pow(1-p,3);fmt(el,to*e);if(p<1)requestAnimationFrame(step)}requestAnimationFrame(step)}
  var els=[].slice.call(document.querySelectorAll('[data-count]'));
  if(still||!('IntersectionObserver' in window)){els.forEach(function(e){fmt(e,+e.dataset.count)});return}
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){run(e.target);io.unobserve(e.target)}})},{threshold:.4});
  els.forEach(function(e){fmt(e,0);io.observe(e)})})();</script>
