<!doctype html>
<!-- Header 01 · Classic · Free from Buildstok: https://buildstok.com/products/headers-pack-html/ · Licence: https://buildstok.com/license/ -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Header 01 · Classic</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* bs-scoped */
.bs-header-01, .bs-header-01 *, .bs-header-01::before, .bs-header-01 *::before, .bs-header-01::after, .bs-header-01 *::after {box-sizing:border-box}
.bs-header-01 {--bs-brand:#4f46e5;--bs-brand-ink:#ffffff;--bs-ink:#0f172a;--bs-muted:#64748b;--bs-line:#e2e8f0;--bs-soft:#f8fafc;--bs-radius:12px;--bs-max:1200px;font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.bs-header-01 {color:var(--bs-ink);background:#fff;-webkit-font-smoothing:antialiased}
.bs-header-01 a {color:inherit;text-decoration:none}
.bs-header-01 button {font:inherit;cursor:pointer}
.bs-header-01 .bs-wrap {max-width:var(--bs-max);margin:0 auto;padding:0 24px}
.bs-header-01 .bs-logo {display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.02em}
.bs-header-01 .bs-logo-mark {display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--bs-brand);color:var(--bs-brand-ink)}
.bs-header-01 .bs-btn {display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:10px;font-weight:600;font-size:14.5px;border:1px solid transparent;transition:.18s}
.bs-header-01 .bs-btn-primary {background:var(--bs-brand);color:var(--bs-brand-ink)}
.bs-header-01 .bs-btn-primary:hover {filter:brightness(1.1);transform:translateY(-1px)}
.bs-header-01 .bs-btn-ghost {border-color:var(--bs-line);background:#fff}
.bs-header-01 .bs-btn-ghost:hover {border-color:var(--bs-ink)}
.bs-header-01 .bs-icon-btn {display:grid;place-items:center;width:42px;height:42px;border-radius:10px;border:0;background:transparent;color:inherit;position:relative}
.bs-header-01 .bs-icon-btn:hover {background:rgba(127,127,127,.12)}
.bs-header-01 .bs-sr {position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.bs-header-01 :focus-visible {outline:2px solid var(--bs-brand);outline-offset:2px}
.bs-demo-body {min-height:340px;display:grid;place-items:center;color:var(--bs-muted);font-size:14px;background:repeating-linear-gradient(135deg,var(--bs-soft) 0 12px,#fff 12px 24px)}
.bs-header-01 .m-toggle {display:none}.bs-header-01 .m-toggle .i-close {display:none}
.bs-header-01 .is-open .m-toggle .i-open {display:none}.bs-header-01 .is-open .m-toggle .i-close {display:block}
.bs-header-01 .m-panel {display:none}
@media(max-width:900px){.bs-header-01 .m-toggle {display:grid}.bs-header-01 .d-only {display:none!important}.bs-header-01 .is-open .m-panel {display:block}}
.bs-header-01 .m-panel {border-top:1px solid var(--bs-line);padding:12px 24px 24px;background:inherit}
.bs-header-01 .m-links a {display:block;padding:14px 0;border-bottom:1px solid var(--bs-line);font-weight:600}
.bs-header-01 .m-cta {display:grid;gap:10px;margin-top:18px}.bs-header-01 .m-cta .bs-btn {width:100%}
.h1 {position:sticky;top:0;z-index:50;background:rgba(255,255,255,.9);backdrop-filter:saturate(1.6) blur(12px);border-bottom:1px solid var(--bs-line)}
.h1 .bar {display:flex;align-items:center;justify-content:space-between;height:72px;gap:24px}
.h1 .links {display:flex;gap:6px}
.h1 .links a {padding:8px 14px;border-radius:8px;font-size:15px;font-weight:500;color:var(--bs-muted);transition:.15s}
.h1 .links a:hover, .h1 .links a.on {color:var(--bs-ink);background:var(--bs-soft)}
.h1 .acts {display:flex;align-items:center;gap:14px}
.h1 .signin {font-weight:600;font-size:15px}

/* bs-root-state */
@media(max-width:900px){.bs-header-01.is-open .m-panel {display:block}}
.bs-header-01.is-open .m-toggle .i-open {display:none}
.bs-header-01.is-open .m-toggle .i-close {display:block}
</style>
<style>
/* Preview page only: you do not need this block in your site */
body {margin:0;color:var(--bs-ink);background:#fff;-webkit-font-smoothing:antialiased}
</style>
</head>
<body>
<header class="bs-header-01 h1">
  <div class="bs-wrap bar"><a href="#" class="bs-logo" aria-label="Lumen home"><span class="bs-logo-mark"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 4v16h12"/></svg></span><span class="logo-name">Lumen</span></a>
    <nav class="links d-only"><a href="#" class=on>Product</a><a href="#">Solutions</a><a href="#">Pricing</a><a href="#">Resources</a><a href="#">Company</a></nav>
    <div class="acts"><a href="#" class="signin d-only">Sign in</a><a href="#" class="bs-btn bs-btn-primary d-only">Get started</a><button class="bs-icon-btn m-toggle" data-menu-toggle aria-expanded="false" aria-label="Menu"><span class="i-open"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></span><span class="i-close"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></span></button></div>
  </div><div class="m-panel"><nav class="m-links"><a href="#">Product</a><a href="#">Solutions</a><a href="#">Pricing</a><a href="#">Resources</a><a href="#">Company</a></nav><div class="m-cta"><a href="#" class="bs-btn bs-btn-primary">Get started</a></div></div>
</header>
<main class="bs-header-01 bs-demo-body">Your page content</main>
<script>document.querySelectorAll('[data-menu-toggle]').forEach(function(b){
  var h=b.closest('header');
  b.addEventListener('click',function(){var o=h.classList.toggle('is-open');b.setAttribute('aria-expanded',o);document.body.style.overflow=o&&h.hasAttribute('data-lock')?'hidden':''});
  h.querySelectorAll('.m-panel a').forEach(function(a){a.addEventListener('click',function(){h.classList.remove('is-open');b.setAttribute('aria-expanded','false');document.body.style.overflow=''})});
});
document.querySelectorAll('[data-sub]').forEach(function(b){b.addEventListener('click',function(){var o=b.parentElement.classList.toggle('sub-open');b.setAttribute('aria-expanded',o)})});</script>
</body>
</html>
