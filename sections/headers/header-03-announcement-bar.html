<style>
/* bs-scoped */
.bs-header-03, .bs-header-03 *, .bs-header-03::before, .bs-header-03 *::before, .bs-header-03::after, .bs-header-03 *::after {box-sizing:border-box}
.bs-header-03 {--bs-brand:#4f46e5;--bs-brand-ink:#ffffff;--bs-ink:#0f172a;--bs-muted:#64748b;--bs-line:#e2e8f0;--bs-soft:#f8fafc;--bs-radius:12px;--bs-max:1200px;font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.bs-header-03 {color:var(--bs-ink);background:#fff;-webkit-font-smoothing:antialiased}
.bs-header-03 a {color:inherit;text-decoration:none}

.bs-header-03 .bs-wrap {max-width:var(--bs-max);margin:0 auto;padding:0 24px}
.bs-header-03 .bs-logo {display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.02em}

.bs-header-03 .bs-btn {display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:10px;font-weight:600;font-size:14.5px;border:1px solid transparent;transition:.18s}
.bs-header-03 .bs-btn-primary {background:var(--bs-brand);color:var(--bs-brand-ink)}
.bs-header-03 .bs-btn-primary:hover {filter:brightness(1.1);transform:translateY(-1px)}
.bs-header-03 .bs-btn-ghost {border-color:var(--bs-line);background:#fff}
.bs-header-03 .bs-btn-ghost:hover {border-color:var(--bs-ink)}
.bs-header-03 .bs-icon-btn {display:grid;place-items:center;width:42px;height:42px;border-radius:10px;border:0;background:transparent;color:inherit;position:relative}
.bs-header-03 .bs-icon-btn:hover {background:rgba(127,127,127,.12)}
.bs-header-03 .bs-sr {position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.bs-header-03 :focus-visible {outline:2px solid var(--bs-brand);outline-offset:2px}
.bs-demo-body {min-height:340px;display:grid;place-items:center;color:var(--bs-muted);font-size:14px;background:repeating-linear-gradient(135deg,var(--bs-soft) 0 12px,#fff 12px 24px)}
.bs-header-03 .m-toggle {display:none}.bs-header-03 .m-toggle .i-close {display:none}
.bs-header-03 .is-open .m-toggle .i-open {display:none}.bs-header-03 .is-open .m-toggle .i-close {display:block}
.bs-header-03 .m-panel {display:none}
@media(max-width:900px){.bs-header-03 .m-toggle {display:grid}.bs-header-03 .d-only {display:none!important}.bs-header-03 .is-open .m-panel {display:block}}
.bs-header-03 .m-panel {border-top:1px solid var(--bs-line);padding:12px 24px 24px;background:inherit}
.bs-header-03 .m-links a {display:block;padding:14px 0;border-bottom:1px solid var(--bs-line);font-weight:600}
.bs-header-03 .m-cta {display:grid;gap:10px;margin-top:18px}.bs-header-03 .m-cta .bs-btn {width:100%}
.h3 {background:#fff;border-bottom:1px solid var(--bs-line)}
.h3 .promo {background:linear-gradient(90deg,#312e81,#4f46e5 50%,#7c3aed);color:#fff;font-size:14px}
.h3 .promo-in {display:flex;align-items:center;justify-content:center;gap:12px;min-height:44px;position:relative;padding-right:48px;flex-wrap:wrap}
.h3 .tag {background:rgba(255,255,255,.2);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
.h3 .promo a {display:inline-flex;align-items:center;gap:4px;font-weight:700;text-decoration:underline;text-underline-offset:3px}
.h3 .x {position:absolute;right:16px;top:50%;transform:translateY(-50%);background:none;border:0;color:#fff;opacity:.8;display:grid}
.h3 .bar {display:flex;align-items:center;gap:40px;height:72px}
.h3 .links {display:flex;gap:28px;font-weight:500;font-size:15px;color:var(--bs-muted)}
.h3 .links a:hover {color:var(--bs-ink)}
.h3 .acts {margin-left:auto;display:flex;gap:10px;align-items:center}
@media(max-width:600px){.h3 .promo-in {justify-content:flex-start;padding:8px 48px 8px 24px;font-size:13px}}

/* bs-root-state */
@media(max-width:900px){.bs-header-03.is-open .m-panel {display:block}}
.bs-header-03.is-open .m-toggle .i-open {display:none}
.bs-header-03.is-open .m-toggle .i-close {display:block}
</style>
<style>
/* Preview page only: you do not need this block in your site */
body {margin:0;color:var(--bs-ink);background:#fff;-webkit-font-smoothing:antialiased}

<header class="bs-header-03 h3">
  <div class="promo" id="promo3"><div class="bs-wrap promo-in"><span class="tag">New</span><span>Version 3.0 is here: faster reports and a new dashboard.</span><a href="#">Read the update <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a><button class="x" aria-label="Dismiss" onclick="this.closest('.promo').remove()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div></div>

  </div><div class="m-panel"><nav class="m-links"><a href="#">Product</a><a href="#">Solutions</a><a href="#">Pricing</a><a href="#">Resources</a></nav><div class="m-cta"><a href="#" class="bs-btn bs-btn-ghost">Sign in</a><a href="#" class="bs-btn bs-btn-primary">Start free trial</a></div></div>

<main class="bs-header-03 bs-demo-body">Your page content</main>
<script>document.querySelectorAll('[data-menu-toggle]').forEach(function(b){
  var h=b.closest('header');
  b.addEventListener('click',function(){var o=h.classList.toggle('is-open');b.setAttribute('aria-expanded',o);document.body.style.overflow=o&&h.hasAttribute('data-lock')?'hidden':''});
  h.querySelectorAll('.m-panel a').forEach(function(a){a.addEventListener('click',function(){h.classList.remove('is-open');b.setAttribute('aria-expanded','false');document.body.style.overflow=''})});
});
document.querySelectorAll('[data-sub]').forEach(function(b){b.addEventListener('click',function(){var o=b.parentElement.classList.toggle('sub-open');b.setAttribute('aria-expanded',o)})});</script>
