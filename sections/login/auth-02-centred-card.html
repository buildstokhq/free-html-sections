<section class="bs-auth-02 au2">
  <form class="card" data-v novalidate>
    <div class="top"><a href="#" class="bs-logo" aria-label="Orbit home"><span class="bs-logo-mark"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="7"/></svg></span><span class="logo-name">Orbit</span></a><h1>Sign in to Orbit</h1><p>Welcome back! Please enter your details.</p></div>

<script>document.querySelectorAll('.pw button').forEach(function(b){b.addEventListener('click',function(){var i=b.parentElement.querySelector('input'),s=i.type==='password';i.type=s?'text':'password';b.setAttribute('aria-pressed',s);b.setAttribute('aria-label',s?'Hide password':'Show password')})});document.querySelectorAll('form[data-v]').forEach(function(f){f.addEventListener('submit',function(e){e.preventDefault();var bad=[].slice.call(f.querySelectorAll('input[required]')).filter(function(i){var ok=i.checkValidity();i.setAttribute('aria-invalid',!ok);return !ok});
  var er=f.querySelector('.err');if(er)er.textContent=bad.length?'Please check the highlighted '+(bad.length>1?'fields.':'field.'):'';if(bad.length){bad[0].focus();return}f.classList.add('done')})});</script>
